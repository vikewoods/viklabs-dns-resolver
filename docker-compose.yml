version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: dns-resolver-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - dns-network

  dns-resolver:
    build: .
    container_name: dns-resolver
    restart: unless-stopped
    ports:
      - "5454:5454/udp"
      - "5454:5454/tcp"
    environment:
      - LISTEN_ADDR=0.0.0.0:5454
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dns-network

networks:
  dns-network:
    driver: bridge

volumes:
  redis-data: