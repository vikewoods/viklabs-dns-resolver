services:
  redis:
    image: redis:7-alpine
    container_name: dns-resolver-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - dns-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  dns-resolver:
    build: .
    container_name: dns-resolver
    restart: unless-stopped
    ports:
      - "5454:5454/udp"
      - "5454:5454/tcp"
    environment:
      - LISTEN_ADDR=0.0.0.0:5454
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - REDIS_POOL_SIZE=100
      - GOMAXPROCS=0              # 0 = use all available CPUs
      - GOGC=200                  # GC runs less frequently (more memory, better performance)
      - GOMEMLIMIT=1536MiB        # Soft memory limit (leave headroom for OS)
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dns-network
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M

networks:
  dns-network:
    driver: bridge

volumes:
  redis-data: